<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMPTE">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<title>SMPTE bridge viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #e6e6e6;
    --dim: #333;
    --panel: #0a0a0a;
    --border: #1f1f1f;
    --green: #00ff88;
    --red: #ff3b3b;
    --grey: #666;
    --orange: #ffaa00;
    --blue: #3b9cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: "Share Tech Mono", monospace;
    height: 100%;
    -webkit-text-size-adjust: 100%;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; letter-spacing: 3px; color: #888;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--grey);
    box-shadow: 0 0 6px currentColor;
    transition: background 0.15s;
  }
  .dot.open    { background: var(--green); }
  .dot.waiting { background: var(--orange); }
  .dot.closed  { background: var(--red); }
  .conn-text { color: #aaa; }
  .spacer { flex: 1; }
  .badge {
    padding: 2px 8px; border: 1px solid var(--dim); color: var(--dim);
    font-size: 10px; letter-spacing: 2px;
  }
  .badge.on.lock { color: var(--green); border-color: var(--green); }
  .badge.on.df   { color: var(--orange); border-color: var(--orange); box-shadow: 0 0 8px rgba(255,170,0,0.35); }

  main {
    flex: 0 0 auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    gap: 10px;
    padding: 22px 10px 12px;
    min-height: 0;
  }
  .tc {
    font-family: "B612 Mono", "Share Tech Mono", monospace;
    font-weight: 700;
    font-size: clamp(36px, 12vw, 160px);
    line-height: 1;
    letter-spacing: 0.03em;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0,255,136,0.5), 0 0 40px rgba(0,255,136,0.2);
    white-space: nowrap;
    transition: color 0.1s, text-shadow 0.1s;
  }
  .tc .sep { opacity: 0.5; }
  .tc.invalid { color: var(--red); text-shadow: 0 0 20px rgba(255,59,59,0.5); }
  .tc.dim { color: var(--dim); text-shadow: none; }
  .rate {
    font-size: clamp(22px, 6vw, 36px);
    letter-spacing: 4px;
    color: var(--blue);
  }
  .rate.df { color: var(--orange); }
  .rate.hidden { visibility: hidden; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px 14px;
    width: 100%;
    max-width: 520px;
    padding: 0 14px;
    font-family: "B612 Mono", monospace;
  }
  .metric { display: flex; flex-direction: column; gap: 2px; }
  .metric .lbl { font-size: 9px; letter-spacing: 2px; color: #666; }
  .metric .val { font-size: 16px; color: #ddd; }
  .metric .val.muted { color: #555; }

  .errors {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    min-height: 0;
  }
  /* Matches the full analyzer's StatusBadge: per-error colour, translucent
     fill, outer+inner glow, blinking dot. Colour/border/glow are set inline
     per-error in applyErrors(); this rule owns layout + typography. */
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: "Share Tech Mono", monospace;
    font-size: 13px; letter-spacing: 2px; font-weight: 700;
    padding: 4px 10px; border-radius: 2px;
    border: 1px solid var(--red); color: var(--red);
  }
  .tag .blink { animation: blink 0.5s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* SESSION LOG — a read-only mirror of the analyzer's session log, fed by
     {type:"log"} snapshots. Fills the lower area and scrolls internally so the
     timecode readout above stays put. */
  .logwrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex; flex-direction: column;
    border-top: 1px solid var(--border);
    padding: 8px 14px 14px;
  }
  .log-title {
    display: flex; justify-content: space-between; align-items: baseline;
    letter-spacing: 3px; color: #666; font-size: 11px; margin-bottom: 6px;
  }
  .log-count { color: #555; letter-spacing: 1px; }
  .log-empty { color: #333; letter-spacing: 2px; font-size: 11px; padding: 6px 0; }
  .log {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .log ul { list-style: none; margin: 0; padding: 0; }
  .log li {
    padding: 5px 6px;
    border-bottom: 1px dotted #1a1a1a;
    border-radius: 3px;
    font-family: "B612 Mono", monospace;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s;
  }
  .log li:last-child { border-bottom: 0; }
  .log li:active { background: rgba(255,255,255,0.06); }
  /* brief flash applied on a successful copy */
  .log li.copied { background: rgba(0,255,136,0.14); }
  .log .row1 { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
  .log .id { color: #555; flex: none; min-width: 30px; text-align: right; }
  .log .time { color: #555; flex: none; }
  .log .event { font-weight: 700; letter-spacing: 1px; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .log .event.info  { color: var(--green); }
  .log .event.error { color: var(--red); }
  .log .count { color: #888; flex: none; }
  .log .row2 { margin-left: 38px; color: #888; font-size: 10px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .log .row2 .tc2 { color: #bbb; }
  .log .note { margin-left: 38px; margin-top: 2px; color: #ccb37a; font-size: 10px; font-style: italic; }

  /* Tap-to-copy confirmation toast. */
  .toast {
    position: fixed; left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    transform: translateX(-50%) translateY(8px);
    background: #0d0d0d; border: 1px solid var(--green); color: var(--green);
    font-family: "Share Tech Mono", monospace; font-size: 12px; letter-spacing: 3px;
    padding: 8px 18px; border-radius: 3px;
    box-shadow: 0 0 12px rgba(0,255,136,0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err {
    border-color: var(--red); color: var(--red);
    box-shadow: 0 0 12px rgba(255,59,59,0.3);
  }

  /* Short viewports (phone landscape): the timecode's vh-based clamp grows
     too tall and gets clipped at the top. Cap it by viewport height, shrink
     the rate, and tighten padding so the whole readout fits without scroll. */
  @media (max-height: 480px) {
    main { padding: 10px 10px 8px; gap: 6px; }
    .tc { font-size: clamp(28px, 13vh, 96px); }
    .rate { font-size: clamp(16px, 5vh, 28px); }
    .metrics { gap: 2px 14px; }
    .metric .val { font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="conn-text" id="conn">CONNECTING</span>
  <span class="spacer"></span>
  <span class="badge df"   id="df">DF</span>
  <span class="badge lock" id="lock">LOCK</span>
</header>

<main>
  <div class="tc dim" id="tc">00:00:00:00</div>
  <div class="rate hidden" id="rate">—</div>
  <div class="errors" id="errors"></div>
  <div class="metrics">
    <div class="metric"><span class="lbl">SOURCE</span>     <span class="val muted" id="m-src">—</span></div>
    <div class="metric"><span class="lbl">CONFIDENCE</span> <span class="val muted" id="m-conf">—</span></div>
    <div class="metric"><span class="lbl">SUBS</span>       <span class="val muted" id="m-subs">—</span></div>
    <div class="metric"><span class="lbl">LEVEL (RMS)</span><span class="val muted" id="m-lvl">—</span></div>
    <div class="metric"><span class="lbl">DRIFT</span>      <span class="val muted" id="m-drift">—</span></div>
    <div class="metric"><span class="lbl">SNR</span>        <span class="val muted" id="m-snr">—</span></div>
  </div>
</main>

<section class="logwrap">
  <div class="log-title"><span>SESSION LOG</span><span class="log-count" id="log-count"></span></div>
  <div class="log-empty" id="log-empty">NO EVENTS</div>
  <div class="log"><ul id="log"></ul></div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  const DF_RATES = new Set(["29.97df", "59.94df"]);
  const STALE_MS = 500;
  // Session-log entries whose leading tag is operational (not a fault) render
  // green, matching the analyzer's logEntryClass / INFO_TAGS.
  const INFO_TAGS = new Set(["LOCK_ACQUIRED", "MEASURING_COMMIT", "CARRIER_SNAPSHOT"]);

  const dotEl    = document.getElementById("dot");
  const connEl   = document.getElementById("conn");
  const lockEl   = document.getElementById("lock");
  const dfEl     = document.getElementById("df");
  const tcEl     = document.getElementById("tc");
  const rateEl   = document.getElementById("rate");
  const errorsEl = document.getElementById("errors");
  const logEl      = document.getElementById("log");
  const logCountEl = document.getElementById("log-count");
  const logEmptyEl = document.getElementById("log-empty");
  const toastEl    = document.getElementById("toast");
  const mSrc     = document.getElementById("m-src");
  const mConf    = document.getElementById("m-conf");
  const mSubs    = document.getElementById("m-subs");
  const mLvl     = document.getElementById("m-lvl");
  const mDrift   = document.getElementById("m-drift");
  const mSnr     = document.getElementById("m-snr");

  const setVal = (el, txt, muted = false) => {
    el.textContent = txt;
    el.classList.toggle("muted", muted || txt === "—");
  };

  let ws = null;
  let reconnectMs = 1000;
  let lastTcAt = 0;
  let staleTimer = null;
  let wsOpen = false;
  let pubConnected = false;

  const pad = (n, w = 2) => String(n).padStart(w, "0");
  function renderTc(msg) {
    const sep = msg.dropFrame ? ";" : ":";
    tcEl.replaceChildren(
      document.createTextNode(pad(msg.hh)),
      sepSpan(":"),
      document.createTextNode(pad(msg.mm)),
      sepSpan(":"),
      document.createTextNode(pad(msg.ss)),
      sepSpan(sep),
      document.createTextNode(pad(msg.ff)),
    );
  }
  function sepSpan(ch) {
    const s = document.createElement("span");
    s.className = "sep";
    s.textContent = ch;
    return s;
  }

  function refreshConn() {
    dotEl.classList.remove("open", "closed", "waiting");
    if (!wsOpen) {
      dotEl.classList.add("closed");
      connEl.textContent = "DISCONNECTED";
    } else if (!pubConnected) {
      dotEl.classList.add("waiting");
      connEl.textContent = "NO PUBLISHER";
    } else {
      dotEl.classList.add("open");
      connEl.textContent = "CONNECTED";
    }
  }

  function applyTc(msg) {
    renderTc(msg);
    // Match the main app: locked == decoder has a fresh frame;
    // valid == locked AND no error tags. DF/LOCK only light when locked,
    // so they don't stay on when code stops rolling.
    const locked = msg.ltcLocked !== false;
    const valid = locked && (msg.frameValid !== false)
      && (!msg.errors || msg.errors.length === 0);
    tcEl.classList.toggle("dim", !locked);
    tcEl.classList.toggle("invalid", locked && !valid);
    lockEl.classList.toggle("on", valid);
    dfEl.classList.toggle("on", locked && !!msg.dropFrame);
    if (msg.errors) applyErrors(msg.errors);
    rateEl.textContent = msg.rate || "";
    rateEl.classList.toggle("df", DF_RATES.has(msg.rate));
    rateEl.classList.toggle("hidden", !msg.rate);

    setVal(mSrc, msg.source ? msg.source.toUpperCase() : "—");
    setVal(mLvl, Number.isFinite(msg.levelDbFS) ? `${msg.levelDbFS.toFixed(1)} dBFS` : "—");
    setVal(mDrift, Number.isFinite(msg.driftPpm) ? `${msg.driftPpm > 0 ? "+" : ""}${msg.driftPpm.toFixed(1)} ppm` : "—");
    setVal(mSnr, Number.isFinite(msg.snr) ? `${msg.snr.toFixed(1)} dB` : "—");
    if (Number.isFinite(msg.dropoutPct)) {
      const conf = Math.max(0, Math.min(99.5, 100 - msg.dropoutPct));
      setVal(mConf, `${conf.toFixed(1)} %`);
    } else {
      setVal(mConf, "—");
    }

    lastTcAt = Date.now();
    scheduleStale();
  }

  function markStale() {
    tcEl.classList.add("dim");
    tcEl.classList.remove("invalid");
    lockEl.classList.remove("on");
    dfEl.classList.remove("on");
    setVal(mLvl, "—"); setVal(mDrift, "—"); setVal(mSnr, "—"); setVal(mConf, "—");
  }

  function scheduleStale() {
    clearTimeout(staleTimer);
    staleTimer = setTimeout(() => {
      if (Date.now() - lastTcAt >= STALE_MS) markStale();
    }, STALE_MS + 20);
  }

  // Per-error colours, kept in sync with the full analyzer's StatusBadge map
  // in App.jsx. Unknown tags fall back to the cyan default used there.
  const ERR_COLORS = {
    CLIP: "#ff0000", HOT: "#ff6600", LOW: "#ff9900", DROPOUT: "#ff3399",
    NOISE: "#cc88ff", DF_INVALID: "#ffaa00", AUDIO_GAP: "#22d3ee",
  };
  function applyErrors(errs) {
    errorsEl.replaceChildren(...(errs || []).map(e => {
      const c = ERR_COLORS[e] || "#22d3ee";
      const el = document.createElement("span");
      el.className = "tag";
      el.style.cssText =
        `border:1px solid ${c};background:${c}22;color:${c};` +
        `box-shadow:0 0 8px ${c}44, inset 0 0 8px ${c}11;`;
      const dot = document.createElement("span");
      dot.className = "blink";
      dot.textContent = "●";
      el.append(dot, document.createTextNode(e));
      return el;
    }));
  }

  const fmtTime = (t) => {
    try { return new Date(t).toLocaleTimeString(undefined, { hour12: false }); }
    catch { return ""; }
  };
  const entryClass = (e) => {
    const lead = e.errors && e.errors[0];
    return lead && INFO_TAGS.has(lead) ? "info" : "error";
  };

  // Plain-text form of a log entry, for tap-to-copy. Mirrors what's shown.
  function entryText(e) {
    const head = [
      e.id != null ? `#${e.id}` : "",
      fmtTime(e.t),
      (e.errors || []).join(" · "),
      e.count > 1 ? `×${e.count}` : "",
    ].filter(Boolean).join("  ");
    const tc = e.from ? `${e.from} → ${e.tc}` : (e.tc ?? "");
    const meta = [
      e.rate, e.source,
      Number.isFinite(e.levelDbFS) ? `${e.levelDbFS} dBFS` : null,
      e.snr != null ? `${Number(e.snr).toFixed(1)} dB` : null,
    ].filter(Boolean).join(" · ");
    let s = `${head} — ${[tc, meta].filter(Boolean).join(" · ")}`;
    if (e.note) s += ` — "${e.note}"`;
    return s;
  }

  let toastTimer = null;
  function showToast(msg, ok = true) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("err", !ok);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  // Clipboard API needs a secure context (https/localhost); over plain-http
  // Tailscale it's unavailable, so fall back to the execCommand textarea trick.
  function legacyCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }
  async function copyEntry(text, li) {
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        ok = true;
      } else {
        ok = legacyCopy(text);
      }
    } catch { ok = legacyCopy(text); }
    showToast(ok ? "COPIED" : "COPY FAILED", ok);
    if (ok && li) {
      li.classList.add("copied");
      setTimeout(() => li.classList.remove("copied"), 350);
    }
  }

  // Re-render the whole list from a session-log snapshot. The analyzer is the
  // single source of truth; we never mutate or accumulate locally. Newest-first
  // to match the analyzer's on-screen order.
  function renderLog(entries) {
    const list = Array.isArray(entries) ? entries : [];
    logCountEl.textContent = list.length
      ? `${list.length} ENTR${list.length === 1 ? "Y" : "IES"}`
      : "";
    logEmptyEl.style.display = list.length ? "none" : "";
    const frag = document.createDocumentFragment();
    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i];
      const li = document.createElement("li");
      li.title = "Tap to copy";
      const copyText = entryText(e);
      li.addEventListener("click", () => copyEntry(copyText, li));

      const row1 = document.createElement("div"); row1.className = "row1";
      const id = document.createElement("span"); id.className = "id";
      id.textContent = e.id != null ? `#${e.id}` : "";
      const time = document.createElement("span"); time.className = "time";
      time.textContent = fmtTime(e.t);
      const ev = document.createElement("span"); ev.className = `event ${entryClass(e)}`;
      ev.textContent = (e.errors || []).join(" · ");
      const cnt = document.createElement("span"); cnt.className = "count";
      cnt.textContent = e.count > 1 ? `×${e.count}` : "";
      row1.append(id, time, ev, cnt);
      li.append(row1);

      const row2 = document.createElement("div"); row2.className = "row2";
      const tc2 = document.createElement("span"); tc2.className = "tc2";
      tc2.textContent = e.from ? `${e.from} → ${e.tc}` : (e.tc ?? "");
      row2.append(tc2);
      const meta = [
        e.rate, e.source,
        Number.isFinite(e.levelDbFS) ? `${e.levelDbFS} dBFS` : null,
        e.snr != null ? `${Number(e.snr).toFixed(1)} dB` : null,
      ].filter(Boolean).join(" · ");
      if (meta) { const m = document.createElement("span"); m.textContent = meta; row2.append(m); }
      li.append(row2);

      if (e.note) {
        const n = document.createElement("div"); n.className = "note";
        n.textContent = `“${e.note}”`;
        li.append(n);
      }
      frag.append(li);
    }
    logEl.replaceChildren(frag);
  }

  function handle(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === "hello") {
      if (msg.lastTc) applyTc(msg.lastTc);
      if (msg.lastLog) renderLog(msg.lastLog.entries);
    } else if (msg.type === "tc") {
      applyTc(msg);
    } else if (msg.type === "error") {
      applyErrors(msg.errors);
    } else if (msg.type === "log") {
      // Full session-log snapshot — the mirror is the analyzer's, not ours.
      renderLog(msg.entries);
    } else if (msg.type === "continuity") {
      // Continuity breaks already appear in the session log as TC_* entries;
      // the standalone message needs no separate handling here.
    } else if (msg.type === "status") {
      setVal(mSubs, Number.isFinite(msg.subscribers) ? String(msg.subscribers) : "—");
      pubConnected = !!msg.publisher;
      refreshConn();
      if (!pubConnected) markStale();
    }
  }

  function connect() {
    wsOpen = false; pubConnected = false; refreshConn();
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/subscribe`);
    ws.onopen = () => { reconnectMs = 1000; wsOpen = true; refreshConn(); };
    ws.onmessage = (e) => {
      try { handle(JSON.parse(e.data)); } catch { /* ignore */ }
    };
    ws.onerror = () => { /* close handler will reconnect */ };
    ws.onclose = () => {
      wsOpen = false; pubConnected = false; refreshConn();
      markStale();
      applyErrors([]);
      setTimeout(connect, reconnectMs);
      reconnectMs = Math.min(reconnectMs * 2, 10000);
    };
  }

  connect();
})();
</script>
</body>
</html>
