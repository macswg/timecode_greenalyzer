name: Deploy analyzer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vite.config.js injects __GIT_COMMIT__/__GIT_COMMIT_COUNT__ from git
          # history, so the build needs full history, not a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node 20.19+ / 22.12+; 18 throws "CustomEvent is not defined".
          node-version: 20
          cache: npm
          cache-dependency-path: smpte-analyzer/package-lock.json

      - name: Install
        working-directory: smpte-analyzer
        run: npm ci

      - name: Build
        working-directory: smpte-analyzer
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: smpte-analyzer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
